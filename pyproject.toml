[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "next-experiment-local"
version = "0.1.0"
description = "An evidence-bound senescence research workflow coordinated by Omnigent"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["science*", "integration*", "benchmark*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
